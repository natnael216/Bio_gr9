        content: `ባዮሎጂ በዕለት ተዕለት ሕይወታችን የሚሰጠው አገልግሎት (አፕሊኬሽን)፦
• Wine-making, the brewing, the baking of bread and the production of cheese all depend on fermentation processes brought about by yeasts, other fungi and bacteria, or enzymes from these organisms.
• ወይን ማምረት፣ ቢራ ጠመቃ፣ እንጀራ/ዳቦ መጋገር እና አይብ ማዘጋጀት ሁሉም የሚወሰኑት በእርሾ (yeasts)፣ በሌሎች ፈንገሶች እና በባክቴሪያዎች፣ ወይም ከእነዚህ ፍጥረታት በሚገኙ ኢንዛይሞች በሚካሄዱ መፍላት (fermentation) ሂደቶች ላይ ነው።
How?
🍇 የወይን ጠጅ አሰራር (Wine-making):
🧫 እርሾ የወይኑን ስኳር ወደ 🍷 አልኮል እና 💨 ካርቦን ዳይኦክሳይድ ይቀይረዋል→ 🍇 → 🍷
(ማለትም፦ እርሾ ስኳርን ወደ አልኮል እና ካርቦን ዳይኦክሳይድ በመቀየር ወይን ያዘጋጃል።)
🍺 ቢራ አጠማመቅ (Brewing (beer)):
በቢራ አጠማመቅ ሂደት ውስጥ፣ 🧫 እርሾ ከ🌾 ገብስ በተሠራው ፈሳሽ (wort) ላይ ይጨመራል።
🧫 እርሾው በፈሳሹ ውስጥ ያለውን 🍬 ስኳር ይመገብና ወደ 🍺 አልኮል እና 💨 ካርቦን ዳይኦክሳይድ (CO₂) ይለውጠዋል።
🍬 ስኳር → (በ🧫 እርሾ) → 🍺 አልኮል + 💨 ካርቦን ዳይኦክሳይድ (CO₂)
ይህ ሂደት ፈሳሹን (wort) 🍺 አልኮል ያለበት (ቢራ) እንዲሆን ያደርገዋል እንዲሁም ከ💨 ካርቦን ዳይኦክሳይዱ የተነሳ 🫧 አረፋ እንዲኖረው ያደርጋል።
🍞 እንጀራ/ዳቦ መጋገር (Baking bread):
🧫 እርሾ በሊጡ ውስጥ ያለውን 🍬 sugar በማፍላት 💨 ካርቦን ዳይኦክሳይድን ያመነጫል፤ ይህም 💨 ካርቦን ዳይኦክሳይድ (CO₂) ዳቦው 🍞 እንዲነሳ ያደርገዋል።
🧀አይብ (Cheese) አሰራር:
🦠 ባክቴሪያ የወተቱን 🥛 ስኳር Lactose ወደ 🧪 Lactic አሲድ በመቀየር ወተቱ እንዲረጋ (curdle) እና 🧀 አይብ እንዲፈጠር ያግዛል።
(ማለትም፦ 🦠 ባክቴሪያ የወተትን ስኳር Lactose ወደ 🧪 Lactic አሲድ በመቀየር ወተቱ እንዲረጋ እና 🧀 እንዲሆን ይረዳል።)
💊 Antibiotics, such as penicillin, are produced by 🧫 mould fungi or 🦠 bacteria.

⚗️ The production of industrial chemicals such as citric acid or lactic acid needs 🦠 bacteria or 🧫 fungi to bring about essential chemical changes.

🚰 Sewage disposal depends on 🦠 bacteria in the filter beds to form the basis of the food chain that purifies the effluent.
🚰 የቆሻሻ ውኃ አወጋገድ የሚመሰረተው በ🧫 filter beds ውስጥ ባሉ 🦠 ባክቴሪያዎች ላይ ሲሆን፣ እነዚህም የቆሻሻ ውኃውን የሚያነጹ 🌿 የምግብ ሰንሰለት (food chain) መሠረት ይፈጥራሉ።
How?
In sewage disposal, tiny organisms called bacteria 🦠 live in the filter beds.
የቆሻሻ ውኃ አወጋገድ ሂደት ላይ፣ ባክቴሪያ 🦠 የሚባሉ ጥቃቅን ፍጥረታት በማጣሪያ beds (filter beds) ውስጥ ይኖራሉ።
They feed on waste 💩, break it down 🔄, and start a food chain 🌿🐛🕊️ that helps clean the dirty water 💧.
እነሱም ቆሻሻውን 💩 በመመገብ፣ በመበሰባበር🔄 እና ቆሻሻውን ውኃ 💧 ለማንጻት የሚረዳ food chain🌿🐛 ይጀምራሉ።
👉 In short: bacteria eat the waste and make the water clean again. 💦✨

In forensic analysis 🔍, DNA from crime scenes 🚔 (like hair, blood, or skin) is compared with suspects’ DNA 🧑‍🔬 to identify who was there or who did it 🕵️‍♂️.
በፎረንሲክ ትንተና 🔍 ደግሞ፣ ከወንጀል ስፍራዎች 🚔 (እንደ ፀጉር፣ ደም ወይም ቆዳ) የተገኘ ዲ ኤን ኤ ከተጠርጣሪዎች ዲ ኤን ኤ 🧑‍🔬 ጋር ይነጻጸራል፤ ይህም ማን በቦታው እንደነበረ ወይም ወንጀሉን እንደፈጸመ 🕵️‍♂️ ለመለየት ይረዳል።

        title: "1.3. The Scientific Method",
        content: `Biology is a science of inquiry. 🔬
What comes to your mind when you hear the word science? 🤔
"ሳይንስ" የሚለውን ቃል ስንሰማ ወደ አእምሮአችን የሚመጣው ምንድን ነው? 💡
Biologists are always curious about why things happen or how things happen. 🧐
ባዮሎጂስቶች ነገሮች ለምን እንደሚፈጸሙ ወይም እንዴት እንደሚፈጸሙ ለማወቅ ሁልጊዜ ጉጉት አላቸው። ❓
By asking questions ❓ and seeking science-based responses known as the scientific method, they come up with new theories 💡 to explain new findings. 🧠
ጥያቄዎችን በመጠየቅ ❓ እና በሳይንሳዊ ዘዴ (scientific method) በመባል የሚታወቁ በሳይንስ ላይ የተመሠረቱ ምላሾችን በመፈለግ፣ አዳዲስ ግኝቶችን ለማስረዳት አዳዲስ ንድፈ ሐሳቦችን (theories) 💡 ያመጣሉ። 🧠
The scientific method involves a series of steps 👣 that guide scientists 🧑‍🔬 through such scientific investigations. 📈
ሳይንሳዊው ዘዴ ሳይንቲስቶችን 🧑‍🔬 በእንደዚህ ዓይነት ሳይንሳዊ ምርመራዎች የሚመሩ ተከታታይ እርምጃዎችን 👣 ያካትታል። 📊
Biologists study the living world  by posing questions about it. 🌿
ባዮሎጂስቶች ስለ  living world(earth) 🌍 ጥያቄዎችን በመጠየቅ ያጠናሉ። 🌳
Observation
መመልከት (Observation) 👀
The scientific study begins with careful observations (often a problem to solve) that leads to a question. The observations can be made either directly (e.g. using your sense organs) or indirectly using scientific tools such as microscopes. 🔭
ሳይንሳዊ ጥናት የሚጀምረው ጥያቄን በሚያስነሳ (ብዙውን ጊዜ ለመፍታት በሚያስፈልግ ችግር) ጥንቃቄ በተሞላበት መመልከት 👀 ነው። ምልከታዎቹ የሚደረጉት በቀጥታ (ለምሳሌ የስሜት ህዋሳትን በመጠቀም) ወይም እንደ ማይክሮስኮፕ 🔭 ባሉ ሳይንሳዊ መሳሪያዎች በተዘዋዋሪ መንገድ ሊሆን ይችላል።
Asking Questions
ጥያቄዎችን መጠየቅ ❓
The observations usually lead the scientist to ask questions (inquiry).
ምልከታዎቹ ብዙውን ጊዜ ሳይንቲስቱን ጥያቄዎችን እንዲጠይቅ ❓ (እንዲመረምር) ይመራሉ።
Forming of a hypothesis
መላምት (Hypothesis) መፍጠር 💡
A hypothesis is proposed scientific explanations (possible answers) for a set of question (s). To solve a problem, one can propose several hypotheses. Scientific hypotheses should be testable. ✅
መላምት 💡 ለአንድ ወይም ለተከታታይ ጥያቄዎች (ችግሮች) ሊሆኑ የሚችሉ መልሶች በሳይንስ የቀረቡ ማብራሪያዎች ናቸው። አንድን ችግር ለመፍታት ብዙ መላምቶችን ማቅረብ ይቻላል። ሳይንሳዊ መላምቶች ሊሞከሩ ✅ የሚችሉ መሆን አለባቸው።
Testing the hypothesis
መላምቱን መሞከር (Testing) 🧪
Hypothesis can be tested through experimentation. 🔬 Any scientific experiment must have the ability to be duplicated because the “answer” the scientist comes up with (whether it supports or rejects the original hypothesis) can’t become part of the scientific knowledge unless other scientists can perform the same experiment and achieve the similar results. If a hypothesis is not supported by experimental data, one can propose a new hypothesis. 🔄
መላምት በሙከራ 🧪 ሊሞከር ይችላል። ማንኛውም ሳይንሳዊ ሙከራ እንደገና የመደገም 🔁 ችሎታ ሊኖረው ይገባል፤ ምክንያቱም ሳይንቲስቱ ያገኘው "መልስ" (የመጀመሪያውን መላምት ይደግፍም ይቃወምም) ሌሎች ሳይንቲስቶች ተመሳሳይ ሙከራዎችን አድርገው ተመሳሳይ ውጤት እስካላገኙ ድረስ የሳይንሳዊ እውቀት አካል ሊሆን አይችልም። አንድ መላምት በሙከራ መረጃ ካልተደገፈ፣ አዲስ መላምት 🔄 ማቅረብ ይቻላል።
Making conclusions about the findings
ስለ ግኝቶቹ መደምደሚያ መስጠት 📝
Scientists consider their original hypotheses and ask whether they could still be right in light of the new information gathered during the experiment. If so, the hypotheses can remain as possible explanations for how things work. If not, scientists reject the hypotheses and try to come up with alternate explanations (new hypotheses) that can explain what they’ve seen. ❌
ሳይንቲስቶች የመጀመሪያ መላምቶቻቸውን ይመለከታሉ እና በሙከራው ወቅት በተሰበሰበው አዲስ መረጃ መሠረት አሁንም ትክክል ሊሆኑ ይችሉ እንደሆነ ይጠይቃሉ። ከሆነ፣ መላምቶቹ ነገሮች እንዴት እንደሚሠሩ እንደ ሊሆኑ የሚችሉ ማብራሪያዎች ይቀራሉ። ካልሆነ፣ ሳይንቲስቶች መላምቶቹን ይሽራሉ ❌ እና ያዩትን ሊያስረዱ የሚችሉ አማራጭ ማብራሪያዎችን (አዲስ መላምቶችን) ይዘው ለመምጣት ይሞክራሉ።
Communicating the findings
ግኝቶቹን ማሳወቅ (Communication) 📢
When scientists complete some work, they write a paper ✍️ that explains exactly what they did and the results they obtained. Then, they submit the paper to a scientific journal in their field. In addition, the findings will be printed in scientific journals and assist teachers and students in the field. 📚
ሳይንቲስቶች ሥራ ሲያጠናቅቁ፣ በትክክል የሠሩትን እና ያገኙትን ውጤት የሚያብራራ ጽሑፍ ✍️ ይጽፋሉ። ከዚያም ጽሑፉን በዘርፋቸው ውስጥ ወዳለ ሳይንሳዊ መጽሔት (journal) ያስገባሉ። ከዚህም በላይ ግኝቶቹ በሳይንሳዊ መጽሔቶች ላይ ይወጣሉ 📚 እንዲሁም በዘርፉ ያሉ መምህራንን እና ተማሪዎችን ይረዳሉ።

👩‍🔬 ምሳሌ: የእጽዋት እድገት ሙከራ 🌱
🔍 Observation:
A student notices that one plant near the window grows faster 🌞🌿 than one in the shade 🌑🌿.
አንድ ተማሪ በመስኮት አጠገብ ያለ በቂ ብርሃን የሚያገኝ  ተክል በበለጠ በቂ  ብርሃን ከማያገኝ ተክል በፍጥነት ሲያድግ 🌞🌿 ይመለከታል።
❓ Asking Question:
❓ ጥያቄ መጠየቅ:
Does sunlight ☀️ make plants grow faster? 🤔
የፀሐይ ብርሃን ☀️ እጽዋት ፈጥነው እንዲያድጉ ያደርጋልን? 🤔
💡 Forming a Hypothesis:
💡 መላምት መፍጠር:
“If a plant gets more sunlight, it will grow faster.” 🌞➡️🌿
"አንድ ተክል ብዙ የፀሐይ ብርሃን ካገኘ፣ በበለጠ ፍጥነት ያድጋል።" 🌞➡️🌿

⚗️ መላምቱን መሞከር:

ተማሪው ሁለት ተመሳሳይ ተክሎችን ይተክላል — አንዱን በፀሐይ ብርሃን ☀️፣ ሌላኛውን በጥላ ስር 🌑 — እና ለሁለት ሳምንታት በእኩል ውኃ 💧 ያጠጣቸዋል።
📊 Making Conclusions:
