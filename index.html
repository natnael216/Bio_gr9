<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 9 Biology Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background-color: #1e1e2d; color: #fff; padding: 20px; }</style>
</head>
<body>
  <div id="content-wrapper">
    <h1 id="title" class="text-2xl font-bold mb-4 text-[#55acee]">Loading...</h1>
    <p id="content" class="whitespace-pre-wrap leading-relaxed"></p>
  </div>

  <script>
    // ADD NEW LESSONS HERE
    const topics = {
      "lesson1": { 
        title: "Unit 1: Introduction to Biology", 
        content: "Biology is the study of life..." 
      },
      "lesson2": { 
        title: "Unit 2: Cell Biology", 
        content: "Cells are the building blocks..." 
      }
    };

    function loadLesson() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        const lessonKey = window.Telegram.WebApp.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get("start_param");
        
        const titleEl = document.getElementById("title");
        const contentEl = document.getElementById("content");

        if (topics[lessonKey]) {
          titleEl.textContent = topics[lessonKey].title;
          contentEl.textContent = topics[lessonKey].content;
        } else {
          titleEl.textContent = "Welcome";
          contentEl.textContent = "Select a lesson from the bot menu.";
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadLesson);
  </script>
</body>
</html>
